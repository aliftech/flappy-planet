<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>HEDGEHOG HORIZON: The Rolling Ascent</title>
    <style>
        :root {
            --bg-sky-top: #2b1055;
            --bg-sky-bot: #7597de;
            --glass: rgba(255, 255, 255, 0.1);
            --glass-border: rgba(255, 255, 255, 0.2);
            --accent: #ffd700;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
            touch-action: none;
        }

        body {
            background: linear-gradient(to bottom, var(--bg-sky-top), var(--bg-sky-bot));
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            overflow: hidden;
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Awesome Wobbly Title */
        .title-container {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            text-align: center;
            z-index: 10;
            pointer-events: none;
        }

        h1 {
            font-size: 2.5rem;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 3px;
            background: linear-gradient(to bottom, #ffffff, #ffd700);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 4px 8px rgba(0,0,0,0.4));
            animation: jelly-title 3s ease-in-out infinite;
        }

        .subtitle {
            font-size: 0.85rem;
            letter-spacing: 5px;
            color: rgba(255, 255, 255, 0.8);
            margin-top: -5px;
            text-transform: uppercase;
            font-weight: 600;
        }

        @keyframes jelly-title {
            0%, 100% { transform: scale(1) rotate(0deg); }
            25% { transform: scale(1.05, 0.95) rotate(-2deg); }
            50% { transform: scale(0.95, 1.05) rotate(2deg); }
            75% { transform: scale(1.02, 0.98) rotate(0deg); }
        }

        /* UI Panels */
        .ui-panel {
            position: absolute;
            top: 100px;
            left: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            z-index: 10;
        }

        .stat-box {
            background: var(--glass);
            border: 1px solid var(--glass-border);
            backdrop-filter: blur(8px);
            border-radius: 12px;
            padding: 12px 20px;
            color: white;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            min-width: 140px;
        }

        .stat-label {
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: rgba(255, 255, 255, 0.6);
            margin-bottom: 4px;
        }

        .stat-value {
            font-size: 1.5rem;
            font-weight: 800;
            color: var(--accent);
            text-shadow: 0 2px 4px rgba(0,0,0,0.3);
        }

        .controls-hint {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--glass);
            border: 1px solid var(--glass-border);
            backdrop-filter: blur(8px);
            border-radius: 30px;
            padding: 10px 25px;
            color: white;
            font-size: 0.85rem;
            display: flex;
            gap: 20px;
            z-index: 10;
        }

        .key {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            background: rgba(255,255,255,0.2);
            width: 28px;
            height: 28px;
            border-radius: 6px;
            font-weight: bold;
            margin: 0 4px;
            border: 1px solid rgba(255,255,255,0.3);
            box-shadow: 0 2px 0 rgba(0,0,0,0.2);
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        /* Mobile Controls */
        .mobile-controls {
            display: none;
            position: absolute;
            bottom: 20px;
            width: 100%;
            justify-content: space-between;
            padding: 0 30px;
            z-index: 10;
        }

        .ctrl-btn {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            border: none;
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(5px);
            border: 2px solid rgba(255, 255, 255, 0.3);
            color: white;
            font-size: 1.8rem;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            cursor: pointer;
            transition: transform 0.1s, background 0.2s;
        }

        .ctrl-btn:active {
            transform: scale(0.9);
            background: rgba(255, 255, 255, 0.3);
        }

        @media (max-width: 768px) {
            h1 { font-size: 1.8rem; }
            .controls-hint { display: none; }
            .mobile-controls { display: flex; }
            .ui-panel { top: 80px; left: 10px; }
            .stat-box { min-width: 100px; padding: 10px 15px; }
        }
    </style>
</head>
<body>

    <div class="title-container">
        <h1>Hedgehog Horizon</h1>
        <div class="subtitle">The Rolling Ascent</div>
    </div>

    <div class="ui-panel">
        <div class="stat-box">
            <div class="stat-label">Distance</div>
            <div class="stat-value" id="distance">0m</div>
        </div>
        <div class="stat-box">
            <div class="stat-label">Coins</div>
            <div class="stat-value" id="coins">0</div>
        </div>
    </div>

    <div class="controls-hint">
        <span><span class="key">←</span> <span class="key">→</span> Roll & Tilt</span>
        <span><span class="key">↑</span> or <span class="key">Space</span> Jump</span>
    </div>

    <div class="mobile-controls">
        <button class="ctrl-btn" id="btn-left">←</button>
        <button class="ctrl-btn" id="btn-jump">↑</button>
        <button class="ctrl-btn" id="btn-right">→</button>
    </div>

    <canvas id="gameCanvas"></canvas>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        
        // UI Elements
        const distEl = document.getElementById('distance');
        const coinsEl = document.getElementById('coins');

        // Game State
        let width, height;
        let cameraX = 0;
        let scoreCoins = 0;
        let maxDistance = 0;
        let frameCount = 0;

        // Physics Constants
        const GRAVITY = 0.4;
        const FRICTION = 0.96;
        const AIR_RESISTANCE = 0.99;
        const ROLL_ACCEL = 0.4;
        const JUMP_FORCE = -11;
        const MAX_SPEED = 15;

        // Player (The Hedgehog)
        const player = {
            x: 200,
            y: 0,
            vx: 0,
            vy: 0,
            radius: 22,
            angle: 0,
            vAngle: 0,
            onGround: false,
            legKick: 0
        };

        // Input State
        const keys = {
            left: false,
            right: false,
            up: false
        };

        // Resize Handling
        function resize() {
            width = window.innerWidth;
            height = window.innerHeight;
            canvas.width = width;
            canvas.height = height;
        }
        window.addEventListener('resize', resize);
        resize();

        // --- Procedural Terrain Generation ---
        // Uses layered sine waves to create smooth, infinite hills
        function getGroundY(x) {
            const base = height * 0.6;
            const hill1 = Math.sin(x * 0.003) * 150;
            const hill2 = Math.sin(x * 0.01) * 40;
            const hill3 = Math.sin(x * 0.03) * 10;
            const bump = Math.sin(x * 0.05) * 5;
            return base + hill1 + hill2 + hill3 + bump;
        }

        function getGroundSlope(x) {
            const delta = 5;
            const y1 = getGroundY(x - delta);
            const y2 = getGroundY(x + delta);
            return Math.atan2(y2 - y1, delta * 2);
        }

        // --- Coin Generation ---
        // Deterministic coin placement based on X coordinate
        function checkCoins() {
            const coinSpacing = 250;
            const currentZone = Math.floor((player.x + 300) / coinSpacing);
            
            for (let i = Math.floor(cameraX / coinSpacing); i <= currentZone + 2; i++) {
                if (i < 0) continue;
                
                const cx = i * coinSpacing + 100;
                // Place coins in arcs or lines above the ground
                const groundY = getGroundY(cx);
                const cy = groundY - 80 - Math.sin(i * 1.5) * 40; 
                
                const dx = player.x - cx;
                const dy = player.y - cy;
                const dist = Math.sqrt(dx * dx + dy * dy);
                
                if (dist < player.radius + 15) {
                    // Collect coin! (Use a pseudo-random ID to ensure we only collect once)
                    const coinId = `coin_${i}`;
                    if (!player.collectedCoins) player.collectedCoins = new Set();
                    
                    if (!player.collectedCoins.has(coinId)) {
                        player.collectedCoins.add(coinId);
                        scoreCoins++;
                        coinsEl.innerText = scoreCoins;
                        
                        // Little jump boost on collection
                        player.vy = Math.min(player.vy, -3);
                    }
                }
            }
        }

        // --- Physics Engine ---
        function updatePhysics() {
            // Input Forces
            if (keys.right) {
                player.vx += ROLL_ACCEL;
                player.vAngle += 0.05;
            }
            if (keys.left) {
                player.vx -= ROLL_ACCEL;
                player.vAngle -= 0.05;
            }
            if (keys.up && player.onGround) {
                player.vy = JUMP_FORCE;
                player.onGround = false;
                player.vAngle *= 0.5; // Reduce spin on jump
            }

            // Gravity
            player.vy += GRAVITY;

            // Air resistance vs Ground friction
            if (player.onGround) {
                player.vx *= FRICTION;
                // Align angle to slope gradually
                const targetAngle = getGroundSlope(player.x);
                player.angle += (targetAngle - player.angle) * 0.2;
                player.vAngle = player.vx * 0.04; // Roll naturally based on speed
            } else {
                player.vx *= AIR_RESISTANCE;
                player.angle += player.vAngle;
                player.legKick += 0.2; // Kick legs when in air
            }

            // Cap speed
            player.vx = Math.max(-MAX_SPEED, Math.min(MAX_SPEED, player.vx));

            // Apply Velocity
            player.x += player.vx;
            player.y += player.vy;

            // Ground Collision
            const groundY = getGroundY(player.x);
            if (player.y + player.radius > groundY) {
                player.y = groundY - player.radius;
                
                // Bounce slightly if hitting hard
                if (player.vy > 8) {
                    player.vy = -player.vy * 0.3;
                } else {
                    player.vy = 0;
                }
                
                player.onGround = true;
                player.legKick = 0;
            } else {
                player.onGround = false;
            }

            // Update Camera (Smooth follow)
            const targetCamX = player.x - width * 0.3;
            cameraX += (targetCamX - cameraX) * 0.1;
            
            // Update Max Distance
            const currentDist = Math.floor(player.x / 10);
            if (currentDist > maxDistance) {
                maxDistance = currentDist;
                distEl.innerText = maxDistance + 'm';
            }

            checkCoins();
            frameCount++;
        }

        // --- Rendering ---
        function draw() {
            // Clear Screen
            ctx.clearRect(0, 0, width, height);

            // 1. Draw Parallax Background Mountains
            ctx.save();
            ctx.fillStyle = 'rgba(43, 16, 85, 0.3)';
            ctx.beginPath();
            ctx.moveTo(0, height);
            for (let x = 0; x <= width; x += 50) {
                const worldX = x + cameraX * 0.2;
                const y = height * 0.5 + Math.sin(worldX * 0.002) * 100 + Math.sin(worldX * 0.01) * 30;
                ctx.lineTo(x, y);
            }
            ctx.lineTo(width, height);
            ctx.fill();
            ctx.restore();

            // 2. Draw Terrain
            ctx.save();
            ctx.translate(-cameraX, 0);
            
            // Ground Fill
            ctx.beginPath();
            const startX = Math.floor(cameraX / 10) * 10 - 10;
            const endX = startX + width + 20;
            
            ctx.moveTo(startX, height);
            for (let x = startX; x <= endX; x += 5) {
                ctx.lineTo(x, getGroundY(x));
            }
            ctx.lineTo(endX, height);
            ctx.closePath();
            
            const gradient = ctx.createLinearGradient(0, height * 0.4, 0, height);
            gradient.addColorStop(0, '#4a8c3a');
            gradient.addColorStop(0.3, '#3a6b2e');
            gradient.addColorStop(1, '#2d4a22');
            ctx.fillStyle = gradient;
            ctx.fill();

            // Ground Top Highlight (Glossy grass)
            ctx.beginPath();
            for (let x = startX; x <= endX; x += 5) {
                if (x === startX) ctx.moveTo(x, getGroundY(x));
                else ctx.lineTo(x, getGroundY(x));
            }
            ctx.strokeStyle = '#7bc96f';
            ctx.lineWidth = 4;
            ctx.stroke();
            ctx.restore();

            // 3. Draw Coins
            ctx.save();
            ctx.translate(-cameraX, 0);
            const coinSpacing = 250;
            const startZone = Math.floor(cameraX / coinSpacing) - 1;
            const endZone = startZone + Math.ceil(width / coinSpacing) + 2;
            
            for (let i = startZone; i <= endZone; i++) {
                if (i < 0) continue;
                const coinId = `coin_${i}`;
                if (player.collectedCoins && player.collectedCoins.has(coinId)) continue;

                const cx = i * coinSpacing + 100;
                const groundY = getGroundY(cx);
                const cy = groundY - 80 - Math.sin(i * 1.5) * 40;
                
                // Floating animation
                const floatY = cy + Math.sin(frameCount * 0.05 + i) * 5;
                
                ctx.save();
                ctx.translate(cx, floatY);
                
                // Coin Glow
                ctx.shadowColor = '#ffd700';
                ctx.shadowBlur = 15;
                
                // Coin Body
                ctx.beginPath();
                ctx.arc(0, 0, 12, 0, Math.PI * 2);
                ctx.fillStyle = '#ffd700';
                ctx.fill();
                
                // Coin Inner Detail
                ctx.beginPath();
                ctx.arc(0, 0, 8, 0, Math.PI * 2);
                ctx.strokeStyle = '#ffaa00';
                ctx.lineWidth = 2;
                ctx.stroke();
                
                ctx.restore();
            }
            ctx.restore();

            // 4. Draw The Hedgehog
            ctx.save();
            ctx.translate(player.x - cameraX, player.y);
            ctx.rotate(player.angle);

            // Legs (only visible when jumping/rolling fast)
            if (!player.onGround || Math.abs(player.vx) > 2) {
                ctx.fillStyle = '#5d4037';
                const kick = Math.sin(player.legKick) * 8;
                // Back leg
                ctx.beginPath();
                ctx.ellipse(-15, 15 + kick, 6, 10, -0.5, 0, Math.PI * 2);
                ctx.fill();
                // Front leg
                ctx.beginPath();
                ctx.ellipse(15, 15 - kick, 6, 10, 0.5, 0, Math.PI * 2);
                ctx.fill();
            }

            // Body (Spiky Ball)
            ctx.fillStyle = '#6d4c41';
            ctx.beginPath();
            ctx.arc(0, 0, player.radius, 0, Math.PI * 2);
            ctx.fill();

            // Spikes
            ctx.fillStyle = '#4e342e';
            for (let i = 0; i < 12; i++) {
                const angle = (i / 12) * Math.PI * 2;
                const sx = Math.cos(angle) * (player.radius - 2);
                const sy = Math.sin(angle) * (player.radius - 2);
                const ex = Math.cos(angle) * (player.radius + 6);
                const ey = Math.sin(angle) * (player.radius + 6);
                
                ctx.beginPath();
                ctx.moveTo(sx, sy);
                ctx.lineTo(ex, ey);
                ctx.lineWidth = 3;
                ctx.strokeStyle = '#3e2723';
                ctx.stroke();
            }

            // Face Area (Lighter snout)
            ctx.fillStyle = '#d7ccc8';
            ctx.beginPath();
            ctx.ellipse(12, 2, 10, 8, 0, 0, Math.PI * 2);
            ctx.fill();

            // Nose
            ctx.fillStyle = '#3e2723';
            ctx.beginPath();
            ctx.arc(18, 0, 3, 0, Math.PI * 2);
            ctx.fill();

            // Eye (Cute and expressive)
            ctx.fillStyle = '#fff';
            ctx.beginPath();
            ctx.arc(8, -6, 5, 0, Math.PI * 2);
            ctx.fill();
            
            ctx.fillStyle = '#000';
            ctx.beginPath();
            ctx.arc(10, -6, 2.5, 0, Math.PI * 2);
            ctx.fill();
            
            // Eye shine
            ctx.fillStyle = '#fff';
            ctx.beginPath();
            ctx.arc(11, -7, 1, 0, Math.PI * 2);
            ctx.fill();

            ctx.restore();

            // 5. Speed Lines (if going fast)
            if (Math.abs(player.vx) > 8) {
                ctx.save();
                ctx.strokeStyle = 'rgba(255, 255, 255, 0.3)';
                ctx.lineWidth = 2;
                for (let i = 0; i < 5; i++) {
                    const lx = (player.x - cameraX) - 40 - Math.random() * 60;
                    const ly = player.y + (Math.random() - 0.5) * 40;
                    ctx.beginPath();
                    ctx.moveTo(lx, ly);
                    ctx.lineTo(lx - 30 - Math.abs(player.vx) * 2, ly);
                    ctx.stroke();
                }
                ctx.restore();
            }
        }

        // --- Game Loop ---
        function loop() {
            updatePhysics();
            draw();
            requestAnimationFrame(loop);
        }

        // --- Input Handling ---
        window.addEventListener('keydown', (e) => {
            if (e.code === 'ArrowRight' || e.code === 'KeyD') keys.right = true;
            if (e.code === 'ArrowLeft' || e.code === 'KeyA') keys.left = true;
            if (e.code === 'ArrowUp' || e.code === 'Space' || e.code === 'KeyW') {
                keys.up = true;
                e.preventDefault(); // Prevent scrolling
            }
        });

        window.addEventListener('keyup', (e) => {
            if (e.code === 'ArrowRight' || e.code === 'KeyD') keys.right = false;
            if (e.code === 'ArrowLeft' || e.code === 'KeyA') keys.left = false;
            if (e.code === 'ArrowUp' || e.code === 'Space' || e.code === 'KeyW') keys.up = false;
        });

        // Mobile Touch Controls
        const btnLeft = document.getElementById('btn-left');
        const btnRight = document.getElementById('btn-right');
        const btnJump = document.getElementById('btn-jump');

        const addTouch = (elem, key) => {
            elem.addEventListener('touchstart', (e) => { e.preventDefault(); keys[key] = true; });
            elem.addEventListener('touchend', (e) => { e.preventDefault(); keys[key] = false; });
            elem.addEventListener('mousedown', (e) => { keys[key] = true; });
            elem.addEventListener('mouseup', (e) => { keys[key] = false; });
        };

        addTouch(btnLeft, 'left');
        addTouch(btnRight, 'right');
        addTouch(btnJump, 'up');

        // Initialize player on ground
        player.y = getGroundY(player.x) - player.radius - 50;
        
        // Start
        loop();
    </script>
</body>
</html>
