<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flappy Planet</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #050510; /* Deep space background for the page */
            font-family: 'Arial', sans-serif;
            overflow: hidden;
        }

        #gameContainer {
            position: relative;
            box-shadow: 0 0 30px rgba(0, 229, 255, 0.3); /* Neon glow */
            border-radius: 8px;
            overflow: hidden;
        }

        canvas {
            display: block;
            background-color: #0b0d17; /* Space dark blue */
            border: 2px solid #00e5ff; /* Neon cyan border */
            border-radius: 8px;
        }

        #scoreDisplay {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 40px;
            font-weight: bold;
            color: #00e5ff; /* Neon cyan */
            text-shadow: 0 0 10px #00e5ff;
            z-index: 10;
            font-family: 'Courier New', monospace;
        }

        #startScreen, #gameOverScreen {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            color: white;
            z-index: 20;
            background: rgba(11, 13, 23, 0.85);
            padding: 30px;
            border-radius: 10px;
            border: 1px solid #00e5ff;
            box-shadow: 0 0 20px rgba(0, 229, 255, 0.2);
        }

        #gameOverScreen {
            display: none;
        }

        h1 {
            font-size: 36px;
            margin: 0 0 10px 0;
            color: #00e5ff;
            text-shadow: 0 0 10px #00e5ff;
            font-family: 'Courier New', monospace;
            letter-spacing: 2px;
        }

        p {
            font-size: 16px;
            margin: 0 0 20px 0;
            color: #ccc;
        }

        button {
            padding: 12px 24px;
            font-size: 18px;
            font-weight: bold;
            color: #050510;
            background-color: #00e5ff; /* Neon cyan */
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-family: 'Courier New', monospace;
            transition: all 0.2s;
            box-shadow: 0 0 10px rgba(0, 229, 255, 0.5);
        }

        button:hover {
            background-color: #ffffff;
            box-shadow: 0 0 20px rgba(0, 229, 255, 0.8);
            transform: scale(1.05);
        }
    </style>
</head>
<body>

    <div id="gameContainer">
        <div id="scoreDisplay">0</div>
        
        <div id="startScreen">
            <h1>FLAPPY PLANET</h1>
            <p>Press SPACE or Tap to Fly</p>
            <button onclick="startGame()">Start Mission</button>
        </div>

        <div id="gameOverScreen">
            <h1>MISSION FAILED</h1>
            <p>Distance: <span id="finalScore">0</span></p>
            <button onclick="resetGame()">Try Again</button>
        </div>

        <canvas id="gameCanvas" width="320" height="480"></canvas>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const scoreDisplay = document.getElementById('scoreDisplay');
        const startScreen = document.getElementById('startScreen');
        const gameOverScreen = document.getElementById('gameOverScreen');
        const finalScoreDisplay = document.getElementById('finalScore');

        // Game variables
        let frames = 0;
        let score = 0;
        let gameRunning = false;
        let animationId;

        // Generate static stars for the background
        const stars = [];
        for (let i = 0; i < 60; i++) {
            stars.push({
                x: Math.random() * canvas.width,
                y: Math.random() * (canvas.height - 40), // Keep above ground
                size: Math.random() * 2 + 0.5,
                opacity: Math.random() * 0.5 + 0.5
            });
        }

        // UFO character object
        const ufo = {
            x: 50,
            y: 150,
            width: 24,
            height: 20,
            velocity: 0,
            gravity: 0.25,
            jumpStrength: -4.5,
            
            draw: function() {
                // Save context for rotation based on velocity
                ctx.save();
                ctx.translate(this.x + this.width/2, this.y + this.height/2);
                let rotation = Math.min(Math.PI / 4, Math.max(-Math.PI / 4, (this.velocity * 0.1)));
                ctx.rotate(rotation);

                // UFO Dome (Glass)
                ctx.fillStyle = '#00e5ff';
                ctx.beginPath();
                ctx.arc(0, -2, 7, Math.PI, 0);
                ctx.fill();
                ctx.strokeStyle = '#fff';
                ctx.lineWidth = 1;
                ctx.stroke();

                // UFO Saucer Body (Metallic Gray)
                ctx.fillStyle = '#a0a0a0';
                ctx.beginPath();
                ctx.ellipse(0, 4, 14, 6, 0, 0, Math.PI * 2);
                ctx.fill();
                ctx.strokeStyle = '#555';
                ctx.lineWidth = 1.5;
                ctx.stroke();

                // UFO Lights (Underneath)
                ctx.fillStyle = '#ffeb3b'; // Yellow lights
                ctx.beginPath();
                ctx.arc(-8, 5, 2, 0, Math.PI * 2);
                ctx.fill();
                ctx.beginPath();
                ctx.arc(0, 7, 2, 0, Math.PI * 2);
                ctx.fill();
                ctx.beginPath();
                ctx.arc(8, 5, 2, 0, Math.PI * 2);
                ctx.fill();

                // Tractor beam glow (subtle)
                ctx.fillStyle = 'rgba(0, 229, 255, 0.2)';
                ctx.beginPath();
                ctx.moveTo(-6, 8);
                ctx.lineTo(6, 8);
                ctx.lineTo(10, 18);
                ctx.lineTo(-10, 18);
                ctx.fill();

                ctx.restore();
            },
            
            update: function() {
                this.velocity += this.gravity;
                this.y += this.velocity;

                // Floor collision
                if (this.y + this.height >= canvas.height - 20) { 
                    this.y = canvas.height - 20 - this.height;
                    gameOver();
                }
                
                // Ceiling collision
                if (this.y <= 0) {
                    this.y = 0;
                    this.velocity = 0;
                }
            },
            
            jump: function() {
                this.velocity = this.jumpStrength;
            }
        };

        // Space Pillars (Obstacles)
        const obstacles = {
            items: [],
            width: 40,
            gap: 110, // Slightly wider for UFO
            dx: 2,
            
            draw: function() {
                for (let i = 0; i < this.items.length; i++) {
                    let p = this.items[i];
                    
                    // Metallic gray color
                    ctx.fillStyle = '#607d8b'; 
                    ctx.strokeStyle = '#37474f';
                    ctx.lineWidth = 2;

                    // Top pillar
                    ctx.fillRect(p.x, 0, this.width, p.top);
                    ctx.strokeRect(p.x, 0, this.width, p.top);
                    
                    // Top pillar cap
                    ctx.fillRect(p.x - 3, p.top - 15, this.width + 6, 15);
                    ctx.strokeRect(p.x - 3, p.top - 15, this.width + 6, 15);
                    
                    // Bottom pillar
                    ctx.fillRect(p.x, canvas.height - 20 - p.bottom, this.width, p.bottom);
                    ctx.strokeRect(p.x, canvas.height - 20 - p.bottom, this.width, p.bottom);
                    
                    // Bottom pillar cap
                    ctx.fillRect(p.x - 3, canvas.height - 20 - p.bottom, this.width + 6, 15);
                    ctx.strokeRect(p.x - 3, canvas.height - 20 - p.bottom, this.width + 6, 15);

                    // Add some "rivet" details to make it look mechanical
                    ctx.fillStyle = '#37474f';
                    ctx.beginPath();
                    ctx.arc(p.x + 10, p.top - 25, 2, 0, Math.PI * 2);
                    ctx.arc(p.x + 30, p.top - 25, 2, 0, Math.PI * 2);
                    ctx.arc(p.x + 10, canvas.height - 20 - p.bottom + 25, 2, 0, Math.PI * 2);
                    ctx.arc(p.x + 30, canvas.height - 20 - p.bottom + 25, 2, 0, Math.PI * 2);
                    ctx.fill();
                }
            },
            
            update: function() {
                // Add new obstacle every 100 frames
                if (frames % 100 === 0) {
                    let topHeight = Math.random() * (canvas.height - 150 - this.gap) + 30;
                    let bottomHeight = canvas.height - 20 - this.gap - topHeight;
                    this.items.push({
                        x: canvas.width,
                        top: topHeight,
                        bottom: bottomHeight,
                        passed: false
                    });
                }
                
                for (let i = 0; i < this.items.length; i++) {
                    let p = this.items[i];
                    p.x -= this.dx;
                    
                    // Collision detection (fair hitbox)
                    let bx = ufo.x + 6;
                    let by = ufo.y + 6;
                    let bw = ufo.width - 12;
                    let bh = ufo.height - 12;
                    
                    // Check top pillar
                    if (bx < p.x + this.width &&
                        bx + bw > p.x &&
                        by < p.top) {
                        gameOver();
                    }
                    
                    // Check bottom pillar
                    if (bx < p.x + this.width &&
                        bx + bw > p.x &&
                        by + bh > canvas.height - 20 - p.bottom) {
                        gameOver();
                    }
                    
                    // Score update
                    if (p.x + this.width < ufo.x && !p.passed) {
                        score++;
                        scoreDisplay.innerText = score;
                        p.passed = true;
                    }
                    
                    // Remove off-screen obstacles
                    if (p.x + this.width < 0) {
                        this.items.shift();
                        i--;
                    }
                }
            },
            
            reset: function() {
                this.items = [];
            }
        };

        // Planetary Ground
        const ground = {
            x: 0,
            draw: function() {
                // Base ground color
                ctx.fillStyle = '#263238';
                ctx.fillRect(0, canvas.height - 20, canvas.width, 20);
                
                // Top border of ground
                ctx.strokeStyle = '#00e5ff';
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.moveTo(0, canvas.height - 20);
                ctx.lineTo(canvas.width, canvas.height - 20);
                ctx.stroke();
                
                // Crater/surface details
                ctx.fillStyle = '#37474f';
                for(let i = this.x; i < canvas.width; i += 40) {
                    ctx.beginPath();
                    ctx.arc(i + 20, canvas.height - 10, 8, 0, Math.PI, true);
                    ctx.fill();
                }
            },
            update: function() {
                this.x -= 2;
                if (this.x <= -40) this.x = 0;
            }
        };

        function draw() {
            // Clear canvas
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            // Draw Stars
            ctx.fillStyle = '#fff';
            for (let star of stars) {
                ctx.globalAlpha = star.opacity;
                ctx.beginPath();
                ctx.arc(star.x, star.y, star.size, 0, Math.PI * 2);
                ctx.fill();
            }
            ctx.globalAlpha = 1.0; // Reset opacity
            
            obstacles.draw();
            ground.draw();
            ufo.draw();
        }

        function update() {
            ufo.update();
            obstacles.update();
            ground.update();
            frames++;
        }

        function loop() {
            if (!gameRunning) return;
            update();
            draw();
            animationId = requestAnimationFrame(loop);
        }

        function startGame() {
            startScreen.style.display = 'none';
            gameOverScreen.style.display = 'none';
            gameRunning = true;
            loop();
        }

        function gameOver() {
            gameRunning = false;
            cancelAnimationFrame(animationId);
            finalScoreDisplay.innerText = score;
            gameOverScreen.style.display = 'block';
        }

        function resetGame() {
            ufo.y = 150;
            ufo.velocity = 0;
            obstacles.reset();
            score = 0;
            frames = 0;
            scoreDisplay.innerText = score;
            startGame();
        }

        // Input handling
        function handleInput(e) {
            if (e.type === 'keydown' && e.code !== 'Space') return;
            if (e.type === 'keydown') e.preventDefault(); // Prevent scrolling
            
            if (gameRunning) {
                ufo.jump();
            } else if (startScreen.style.display !== 'none') {
                startGame();
            } else if (gameOverScreen.style.display === 'block') {
                resetGame();
            }
        }

        window.addEventListener('keydown', handleInput);
        canvas.addEventListener('mousedown', handleInput);
        canvas.addEventListener('touchstart', (e) => {
            e.preventDefault(); // Prevent zoom/scroll
            handleInput(e);
        }, { passive: false });

        // Initial draw
        draw();
    </script>
</body>
</html>
